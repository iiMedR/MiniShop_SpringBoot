services:
  postgres:
    image: postgres:17
    container_name: miniShop_postgres

    environment:
      POSTGRES_DB: ${PG_URL}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - "miniShop-postgres-data:/var/lib/postgresql/data"

volumes:
  miniShop-postgres-data: